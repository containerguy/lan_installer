name: CI

on:
  push:
    branches: [main, "agent/**"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Test management UI JavaScript
        run: make web-test
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: Build Windows client
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o LANReady.exe ./cmd/lanready
      - name: Build Linux services
        run: |
          CGO_ENABLED=0 go build -trimpath -o lanready-server ./cmd/lanready-server
          CGO_ENABLED=0 go build -trimpath -o lanready-manifest ./cmd/lanready-manifest

  release-windows-cli:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: Build Windows CLI client
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o LANReady.exe ./cmd/lanready
      - uses: softprops/action-gh-release@v2
        with:
          files: LANReady.exe
          generate_release_notes: true

  release-docker-images:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [server, manifest, signer, signer-service]
    steps:
      - uses: actions/checkout@v6
      - name: Compute version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:latest
