name: lanready

services:
  server:
    build:
      context: .
      target: server
      args:
        VERSION: ${LANREADY_VERSION:-dev}
    restart: unless-stopped
    init: true
    user: "${LANREADY_UID:-1000}:${LANREADY_GID:-1000}"
    environment:
      LANREADY_CLIENT_TOKEN: ${LANREADY_CLIENT_TOKEN:?Set LANREADY_CLIENT_TOKEN in .env}
      LANREADY_ADMIN_TOKEN: ${LANREADY_ADMIN_TOKEN:?Set LANREADY_ADMIN_TOKEN in .env}
      LANREADY_WEB_ADMIN_USER: ${LANREADY_WEB_ADMIN_USER:-admin}
      LANREADY_WEB_ADMIN_PASSWORD_FILE: /run/secrets/web_admin_password
      LANREADY_WEBDAV_MASTER_KEY_FILE: /run/secrets/webdav_master_key
      LANREADY_SECURE_COOKIES: ${LANREADY_SECURE_COOKIES:-true}
      LANREADY_PUBLIC_URL: ${LANREADY_PUBLIC_URL:?Set LANREADY_PUBLIC_URL in .env, for example https://game-manager.example.org}
      LANREADY_TRUSTED_PROXY_CIDRS: ${LANREADY_TRUSTED_PROXY_CIDRS:?Set LANREADY_TRUSTED_PROXY_CIDRS to the actual Nginx Proxy Manager Docker network CIDR}
      LANREADY_SOURCE_PRIVATE_ALLOWLIST: ${LANREADY_SOURCE_PRIVATE_ALLOWLIST:-}
      LANREADY_RELEASE_PUBLIC_KEY_FILES: /run/secrets/release_public_key
      LANREADY_EVENT_RELEASE_PUBLIC_KEY_FILES: /run/secrets/release_public_key,/run/secrets/event_release_public_key
      LANREADY_RELEASE_SIGNER_SOCKET: /run/lanready-signer/signer.sock
      LANREADY_RELEASE_SCHEMA_DIR: /usr/share/lanready/schemas
      LANREADY_AUTHENTICODE_PUBLISHER_SHA256: ${LANREADY_AUTHENTICODE_PUBLISHER_SHA256:-}
      LANREADY_CACHE_ROOT: /cache
      LANREADY_CACHE_QUOTA_BYTES: ${LANREADY_CACHE_QUOTA_BYTES:-10737418240}
      LANREADY_CACHE_VOLUME_ID: ${LANREADY_CACHE_VOLUME_ID:-}
    volumes:
      - ./data:/data
      - ${LANREADY_CACHE_HOST_PATH:-./data/cache}:/cache
      - ./data/signer:/run/lanready-signer:ro
    secrets:
      - web_admin_password
      - webdav_master_key
      - release_public_key
      - event_release_public_key
    ports:
      - "${LANREADY_BIND_ADDRESS:-0.0.0.0}:${LANREADY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      signer-service:
        condition: service_healthy

  signer-service:
    build:
      context: .
      target: signer-service
    restart: unless-stopped
    init: true
    user: "${LANREADY_UID:-1000}:${LANREADY_GID:-1000}"
    network_mode: none
    volumes:
      - ./data/signer:/run/lanready-signer
    secrets:
      - source: event_release_private_key
        target: event_release_private_key
        mode: 0400
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/lanready-signer/signer.sock"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 3s

  manifest:
    profiles: ["tools"]
    build:
      context: .
      target: manifest
    user: "${LANREADY_UID:-1000}:${LANREADY_GID:-1000}"
    working_dir: /work
    volumes:
      - ./:/work
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  signer:
    profiles: ["tools"]
    build:
      context: .
      target: signer
    user: "${LANREADY_UID:-1000}:${LANREADY_GID:-1000}"
    working_dir: /work
    volumes:
      - ./release-work:/work
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mirror:
    image: nginx:1.30.4-alpine3.24
    profiles: ["mirror"]
    restart: unless-stopped
    volumes:
      - ./data/content:/srv/lanready/content:ro
      - ./deploy/nginx/mirror.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LANREADY_MIRROR_PORT:-8081}:8081"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  web_admin_password:
    file: ${LANREADY_WEB_ADMIN_PASSWORD_FILE:-./secrets/web-admin-password.txt}
  webdav_master_key:
    file: ${LANREADY_WEBDAV_MASTER_KEY_FILE:-./secrets/webdav-master-key.txt}
  release_public_key:
    file: ${LANREADY_RELEASE_PUBLIC_KEY_FILE:-./secrets/release-public.key}
  event_release_public_key:
    file: ${LANREADY_EVENT_RELEASE_PUBLIC_KEY_FILE:-./secrets/event-release-public.key}
  event_release_private_key:
    file: ${LANREADY_EVENT_RELEASE_PRIVATE_KEY_FILE:-./release-work/event-release-private.key}
